<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Next Station 3D · SG Games</title>
  <meta name="description" content="Next Station: be the MRT train captain. Keep under the speed limits, keep your passengers comfortable and stop right at the platform doors. Three fictional lines, solo or pass the phone." />
  <meta name="theme-color" content="#FFFCF5" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/station.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="is-3d">
  <div class="app" id="app"><noscript><p style="padding:24px">Next Station needs JavaScript to run.</p></noscript></div>
  <script type="module">
    import { startFlow } from '../js/flow.js';
    import { Board3D } from '../js/board3d.js';
    window.__nextStation = startFlow({
      root: document.getElementById('app'),
      createBoard: (el) => new Board3D(el, { modelUrl: '../models/station-assets.glb', fallbackHref: '../' }),
      hubHref: '../../../',
      altHref: '../',
      altLabel: 'Switch to 2D',
    });
  </script>
</body>
</html>
