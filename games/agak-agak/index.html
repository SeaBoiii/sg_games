<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Agak Agak · SG Games</title>
  <meta name="description" content="Agak Agak, a Singapore-edition party game. Spin the wheel, give one clue, and guess how close you can get." />
  <meta name="theme-color" content="#FFFCF5" />
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div class="app" id="app">
    <noscript><p style="padding:24px">Agak Agak needs JavaScript to run.</p></noscript>
  </div>
  <script type="module">
    import { startFlow } from './js/flow.js';
    import { Dial2D } from './js/dial2d.js';
    startFlow({
      root: document.getElementById('app'),
      createDial: (stage) => new Dial2D(stage, { tileHref: '../../assets/tile.svg' }),
      hubHref: '../../',
      altHref: '3d/',
      altLabel: 'Switch to 3D',
    });
  </script>
</body>
</html>
