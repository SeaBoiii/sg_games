<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Agak Agak 3D · SG Games</title>
  <meta name="description" content="Agak Agak in 3D. The Singapore-edition guessing game, played on a kopitiam table." />
  <meta name="theme-color" content="#FFFCF5" />
  <link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="modulepreload" href="../js/flow.js" />
  <link rel="stylesheet" href="../css/game.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="is-3d">
  <div class="app" id="app">
    <noscript><p style="padding:24px">Agak Agak needs JavaScript to run.</p></noscript>
  </div>
  <script type="module">
    import { startFlow } from '../js/flow.js';
    import { Dial3D } from '../js/dial3d.js';
    startFlow({
      root: document.getElementById('app'),
      createDial: (stage) => new Dial3D(stage, { modelUrl: '../models/agak-scene.glb', tileHref: '../../../assets/tile.svg', fallbackHref: '../' }),
      hubHref: '../../../',
      altHref: '../',
      altLabel: 'Switch to 2D',
    });
  </script>
</body>
</html>
