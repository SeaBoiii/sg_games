<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wrong turn · SG Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6EFE3; color: #2A1A12; font: 17px/1.5 'DM Sans', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font: 800 clamp(48px, 12vw, 96px)/.95 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -.04em; margin: 0 0 12px; }
    h1 span { color: #D7263D; }
    p { color: #5B4636; margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; min-height: 50px; padding: 0 24px; border-radius: 999px; border: 2px solid #2A1A12; background: #D7263D; color: #fff; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #2A1A12; }
  </style>
</head>
<body>
  <main>
    <h1>Wrong turn <span>lah</span></h1>
    <p>This page got choped by someone else. Let's go back.</p>
    <a id="home" href="/">Back to SG Games</a>
  </main>
  <script>
    // Project sites live under /<repo>/, so send people to that root.
    if (location.hostname.endsWith('github.io')) {
      const seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
